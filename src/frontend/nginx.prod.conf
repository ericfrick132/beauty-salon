# Subdominio de un negocio (la-aldea-jara.turnos-pro.com): servía las landings,
# las demos y los legales de TurnosPro con canonical al dominio principal y
# Search Console los contaba como copias ("página alternativa con canónica").
# Esas páginas van con 301 a turnos-pro.com y la raíz va a /book del negocio.
map $host $tenant_host {
    default                                        0;
    ~*^(www|app|api)\.turnos-pro\.com$             0;
    ~*^[a-z0-9-]+\.turnos-pro\.com$                1;
}
map "$tenant_host:$uri" $tenant_to_main_site {
    default                                                                                                                                       0;
    ~^1:/(turnos|privacidad|terminos|reservas-online|demo-admin|demo-app|ayuda|ayuda/[a-z0-9-]+|uy|mx|es|sistema-de-turnos-con-sena|sistema-de-turnos-online-gratis|sistema-de-turnos-para-[a-z-]+)/?$  1;
}

server {
    listen 80;
    server_name localhost;

    # www → dominio principal (301). Evita repartir señales entre www y apex;
    # los subdominios de los negocios no matchean.
    if ($host ~* ^www\.(.+)$) { return 301 https://$1$request_uri; }
    if ($tenant_to_main_site) { return 301 https://turnos-pro.com$request_uri; }
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CRITICAL: Health check endpoint for Digital Ocean
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Note: API requests are handled by DO App Platform routing

    # Marketing landing (export estático Next) en /usr/share/nginx/marketing
    # Si no existe, cae al SPA en /usr/share/nginx/html
    location = / {
        root /usr/share/nginx;
        # La raíz de un negocio mostraba la home de TurnosPro: va directo a su
        # página de reservas (/book), que es la que posiciona por el nombre del negocio.
        if ($tenant_host) {
            return 302 https://$host/book$is_args$args;
        }
        try_files /marketing/index.html /html/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Rutas estáticas del export Next
    location ^~ /_next/ {
        alias /usr/share/nginx/marketing/_next/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Assets del landing (public/landing en el export)
    location ^~ /landing/ {
        alias /usr/share/nginx/marketing/landing/;
        try_files $uri $uri/ =404;
    }

    # Plantillas descargables (PDF/Excel) del export Next (public/plantillas)
    location ^~ /plantillas/ {
        alias /usr/share/nginx/marketing/plantillas/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # robots.txt y sitemap.xml salen del export Next (antes caían al SPA)
    location = /robots.txt {
        alias /usr/share/nginx/marketing/robots.txt;
    }

    location = /llms.txt {
        alias /usr/share/nginx/marketing/llms.txt;
        default_type text/plain;
    }

    location = /sitemap.xml {
        alias /usr/share/nginx/marketing/sitemap.xml;
    }

    # Páginas del sitio de marketing (export Next sin trailingSlash: /turnos → turnos.html).
    # Whitelist explícita: cualquier otra ruta sigue cayendo al SPA. /uy, /mx y /es son las landings
    # de Uruguay, México y España.
    # Videos y PDFs del Centro de ayuda (public/ayuda/<slug>.mp4|.pdf, fase 2). Los .jpg los toma la
    # regla de estáticos de abajo, que también busca en /marketing.
    location ~ ^/ayuda/[a-z0-9-]+\.(mp4|pdf)$ {
        root /usr/share/nginx/marketing;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # /ayuda y /ayuda/<slug> son el Centro de ayuda (curso).
    location ~ ^/(turnos|privacidad|terminos|reservas-online|demo-admin|demo-app|promo|ayuda|ayuda/[a-z0-9-]+|uy|mx|es|sistema-de-turnos-con-sena|sistema-de-turnos-online-gratis|sistema-de-turnos-para-(peluquerias|barberias|centros-de-estetica|consultorios))/?$ {
        root /usr/share/nginx/marketing;
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Serve static files with caching (SPA assets; fallback al export de marketing para /og-cover.jpg, /logo.png)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files /html$uri /marketing$uri =404;
    }

    # /guias se mudó al blog central (/blog, lo sirve el backend vía ingress): 301 permanente.
    location ~ ^/guias/?$ { return 301 https://$host/blog/; }
    location ~ ^/guias/mejor-sistema-de-turnos-online-argentina/?$ { return 301 https://$host/blog/mejor-sistema-de-turnos-online-argentina/; }

    # Universal Links de la app iOS (links /book del negocio abren la app). Apple lo pide como JSON.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    # Handle React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache policy for HTML files
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
