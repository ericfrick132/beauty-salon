server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CRITICAL: Health check endpoint for Digital Ocean
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Note: API requests are handled by DO App Platform routing

    # Marketing landing (export estático Next) en /usr/share/nginx/marketing
    # Si no existe, cae al SPA en /usr/share/nginx/html
    location = / {
        root /usr/share/nginx;
        try_files /marketing/index.html /html/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Rutas estáticas del export Next
    location ^~ /_next/ {
        alias /usr/share/nginx/marketing/_next/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Assets del landing (public/landing en el export)
    location ^~ /landing/ {
        alias /usr/share/nginx/marketing/landing/;
        try_files $uri $uri/ =404;
    }

    # Plantillas descargables (PDF/Excel) del export Next (public/plantillas)
    location ^~ /plantillas/ {
        alias /usr/share/nginx/marketing/plantillas/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # robots.txt y sitemap.xml salen del export Next (antes caían al SPA)
    location = /robots.txt {
        alias /usr/share/nginx/marketing/robots.txt;
    }

    location = /sitemap.xml {
        alias /usr/share/nginx/marketing/sitemap.xml;
    }

    # Páginas del sitio de marketing (export Next sin trailingSlash: /turnos → turnos.html).
    # Whitelist explícita: cualquier otra ruta sigue cayendo al SPA.
    location ~ ^/(turnos|privacidad|terminos|reservas-online|sistema-de-turnos-para-(peluquerias|barberias|centros-de-estetica|consultorios))/?$ {
        root /usr/share/nginx/marketing;
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Serve static files with caching (SPA assets; fallback al export de marketing para /og-cover.jpg, /logo.png)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files /html$uri /marketing$uri =404;
    }

    # /guias se mudó al blog central (/blog, lo sirve el backend vía ingress): 301 permanente.
    location ~ ^/guias/?$ { return 301 https://$host/blog/; }
    location ~ ^/guias/mejor-sistema-de-turnos-online-argentina/?$ { return 301 https://$host/blog/mejor-sistema-de-turnos-online-argentina/; }

    # Handle React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache policy for HTML files
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
