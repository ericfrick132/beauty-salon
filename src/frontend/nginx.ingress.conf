server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Marketing landing (export estático Next) en /usr/share/nginx/marketing
    # Si no existe, cae al SPA en /usr/share/nginx/html
    location = / {
        root /usr/share/nginx;
        try_files /marketing/index.html /html/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ^~ /_next/ {
        alias /usr/share/nginx/marketing/_next/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /landing/ {
        alias /usr/share/nginx/marketing/landing/;
        try_files $uri $uri/ =404;
    }

    # robots.txt y sitemap.xml salen del export Next (antes caían al SPA)
    location = /robots.txt {
        alias /usr/share/nginx/marketing/robots.txt;
    }

    location = /sitemap.xml {
        alias /usr/share/nginx/marketing/sitemap.xml;
    }

    # Páginas del sitio de marketing (export Next sin trailingSlash: /turnos → turnos.html).
    # Whitelist explícita: cualquier otra ruta sigue cayendo al SPA.
    location ~ ^/(turnos|privacidad|terminos|guias(/[a-z0-9-]+)?|sistema-de-turnos-para-(peluquerias|barberias|centros-de-estetica|consultorios))/?$ {
        root /usr/share/nginx/marketing;
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files /html$uri /marketing$uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;

        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
